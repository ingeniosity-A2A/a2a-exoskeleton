[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-exoskeleton"
version = "1.0.0"
description = "A2A Exoskeleton Substrate - O(1) Context Orchestration Layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "marker-pdf>=2.0.0",
    "pyarrow>=12.0.0",
    "tiktoken>=0.5.0",
    "torch>=2.0.0",
    "diffusers>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["exoskeleton*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
